<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Shell-authored poster for the /wardogs route (2026-09-02): no Steam
       library_600x900 portrait capsule exists yet for this pre-release title
       (app id 1867240 - checked; only landscape header/capsule_616x353 are
       uploaded so far), so per NEW-GAME-TEMPLATE 1A ("SVG only if no box art
       can exist") this fills the same 2:3 frame as the game covers, in the
       route's own theme colours (--accent #5b7a8c gunmetal, --accent-2
       #d4832e brass/tracer). Swap for the real capsule the day Bulkhead
       uploads one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d0f"/>
      <stop offset="0.55" stop-color="#141b1f"/>
      <stop offset="1" stop-color="#0a0d0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#5b7a8c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b7a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d32"/>
      <stop offset="1" stop-color="#161d20"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>

  <!-- faint topo/grid lines: a war-room map ground -->
  <g stroke="#5b7a8c" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="750" x2="600" y2="750"/>
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
  </g>

  <!-- reticle: three converging marks for the three factions -->
  <g transform="translate(300 390)">
    <circle r="150" fill="none" stroke="#5b7a8c" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="112" fill="none" stroke="#5b7a8c" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="-172" y1="0" x2="-160" y2="0" stroke="#5b7a8c" stroke-width="3" opacity="0.6"/>
    <line x1="172" y1="0" x2="160" y2="0" stroke="#5b7a8c" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="-172" x2="0" y2="-160" stroke="#5b7a8c" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="172" x2="0" y2="160" stroke="#5b7a8c" stroke-width="3" opacity="0.6"/>
    <!-- faction blips: blue / red / green, matching Lonestar / Valkyra / Manticore -->
    <circle cx="-88" cy="-70" r="7" fill="#3b82f6" opacity="0.85"/>
    <circle cx="96" cy="-42" r="7" fill="#ef4444" opacity="0.85"/>
    <circle cx="18" cy="98" r="7" fill="#22c55e" opacity="0.85"/>

    <!-- dog tags, stacked -->
    <g transform="translate(-26 -8) rotate(-6)">
      <rect x="-58" y="-30" width="116" height="62" rx="14" fill="url(#tag)" stroke="#8db0c2" stroke-opacity="0.55" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="7" fill="none" stroke="#8db0c2" stroke-opacity="0.55" stroke-width="2.5"/>
    </g>
    <g transform="translate(20 14) rotate(9)">
      <rect x="-58" y="-30" width="116" height="62" rx="14" fill="url(#tag)" stroke="#d4832e" stroke-opacity="0.65" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="7" fill="none" stroke="#d4832e" stroke-opacity="0.65" stroke-width="2.5"/>
    </g>
  </g>

  <!-- caption -->
  <g text-anchor="middle" font-family="Segoe UI, Roboto, system-ui, sans-serif">
    <text x="300" y="672" font-size="40" font-weight="700" letter-spacing="10" fill="#c7d6dc">WARDOGS</text>
    <text x="300" y="708" font-size="17" letter-spacing="4" fill="#7f97a1">99 PLAYERS &#183; 3 FACTIONS &#183; ONE ZONE</text>
    <text x="300" y="742" font-size="13" letter-spacing="2" fill="#5b7a8c" opacity="0.85">UNOFFICIAL FAN COMPANION &#183; PRE-RELEASE</text>
  </g>
</svg>
